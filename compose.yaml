services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - token_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-token}
      POSTGRES_USER: ${POSTGRES_USER:-token}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - token_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  token:
    build: .
    restart: unless-stopped
    environment:
      TOKEN_DATABASE_URL: ${TOKEN_DATABASE_URL:?set TOKEN_DATABASE_URL in .env.docker}
      TOKEN_ENVIRONMENT: ${TOKEN_ENVIRONMENT:-production}
      TOKEN_AUTO_CREATE_SCHEMA: "false"
      TOKEN_ADMIN_TOKEN: ${TOKEN_ADMIN_TOKEN:?set TOKEN_ADMIN_TOKEN in .env.docker}
      TOKEN_PROVIDER_SECRETS_KEY: ${TOKEN_PROVIDER_SECRETS_KEY:?set TOKEN_PROVIDER_SECRETS_KEY in .env.docker}
      TOKEN_PAYMENT_WEBHOOK_SECRET: ${TOKEN_PAYMENT_WEBHOOK_SECRET:?set TOKEN_PAYMENT_WEBHOOK_SECRET in .env.docker}
      TOKEN_TRIAL_SIGNING_SECRET: ${TOKEN_TRIAL_SIGNING_SECRET:?set TOKEN_TRIAL_SIGNING_SECRET in .env.docker}
      TOKEN_TRIAL_TOKEN_TTL_SECONDS: ${TOKEN_TRIAL_TOKEN_TTL_SECONDS:-604800}
      TOKEN_PUBLIC_BASE_URL: ${TOKEN_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      TOKEN_CORS_ORIGINS: ${TOKEN_CORS_ORIGINS:-}
      TOKEN_MAX_REQUEST_BODY_BYTES: ${TOKEN_MAX_REQUEST_BODY_BYTES:-1048576}
      TOKEN_API_RATE_LIMIT_REQUESTS: ${TOKEN_API_RATE_LIMIT_REQUESTS:-120}
      TOKEN_API_RATE_LIMIT_WINDOW_SECONDS: ${TOKEN_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      TOKEN_PORTAL_RATE_LIMIT_REQUESTS: ${TOKEN_PORTAL_RATE_LIMIT_REQUESTS:-60}
      TOKEN_PORTAL_RATE_LIMIT_WINDOW_SECONDS: ${TOKEN_PORTAL_RATE_LIMIT_WINDOW_SECONDS:-60}
      TOKEN_AUTH_RATE_LIMIT_REQUESTS: ${TOKEN_AUTH_RATE_LIMIT_REQUESTS:-10}
      TOKEN_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${TOKEN_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      TOKEN_REDIS_URL: ${TOKEN_REDIS_URL:-redis://redis:6379/0}
      TOKEN_RATE_LIMIT_KEY_PREFIX: ${TOKEN_RATE_LIMIT_KEY_PREFIX:-loktoken:rate-limit}
      TOKEN_RATE_LIMIT_FAIL_OPEN: ${TOKEN_RATE_LIMIT_FAIL_OPEN:-false}
      TOKEN_PORTAL_SESSION_TTL_SECONDS: ${TOKEN_PORTAL_SESSION_TTL_SECONDS:-604800}
      TOKEN_ADMIN_SESSION_TTL_SECONDS: ${TOKEN_ADMIN_SESSION_TTL_SECONDS:-28800}
      TOKEN_PASSWORD_RESET_TTL_SECONDS: ${TOKEN_PASSWORD_RESET_TTL_SECONDS:-900}
      TOKEN_SECURITY_DELIVERY_MODE: ${TOKEN_SECURITY_DELIVERY_MODE:-webhook}
      TOKEN_SECURITY_DELIVERY_WEBHOOK_URL: ${TOKEN_SECURITY_DELIVERY_WEBHOOK_URL:?set TOKEN_SECURITY_DELIVERY_WEBHOOK_URL in .env.docker}
      TOKEN_SECURITY_DELIVERY_WEBHOOK_SECRET: ${TOKEN_SECURITY_DELIVERY_WEBHOOK_SECRET:?set TOKEN_SECURITY_DELIVERY_WEBHOOK_SECRET in .env.docker}
      TOKEN_OIDC_ENABLED: ${TOKEN_OIDC_ENABLED:-false}
      TOKEN_OIDC_ISSUER_URL: ${TOKEN_OIDC_ISSUER_URL:-}
      TOKEN_OIDC_CLIENT_ID: ${TOKEN_OIDC_CLIENT_ID:-}
      TOKEN_OIDC_CLIENT_SECRET: ${TOKEN_OIDC_CLIENT_SECRET:-}
      TOKEN_OIDC_AUTHORIZATION_ENDPOINT: ${TOKEN_OIDC_AUTHORIZATION_ENDPOINT:-}
      TOKEN_OIDC_TOKEN_ENDPOINT: ${TOKEN_OIDC_TOKEN_ENDPOINT:-}
      TOKEN_OIDC_USERINFO_ENDPOINT: ${TOKEN_OIDC_USERINFO_ENDPOINT:-}
      TOKEN_OIDC_REDIRECT_URI: ${TOKEN_OIDC_REDIRECT_URI:-}
      TOKEN_OIDC_FRONTEND_REDIRECT_URL: ${TOKEN_OIDC_FRONTEND_REDIRECT_URL:-}
      TOKEN_OIDC_SCOPES: ${TOKEN_OIDC_SCOPES:-openid profile email lok_user_id}
      TOKEN_OIDC_ACCOUNT_ID_CLAIM: ${TOKEN_OIDC_ACCOUNT_ID_CLAIM:-lok_user_id}
      TOKEN_OIDC_ALLOW_ACCOUNT_CREATION: ${TOKEN_OIDC_ALLOW_ACCOUNT_CREATION:-true}
      TOKEN_LOKSYSTEM_SSO_ENABLED: ${TOKEN_LOKSYSTEM_SSO_ENABLED:-false}
      TOKEN_LOKSYSTEM_SSO_BASE_URL: ${TOKEN_LOKSYSTEM_SSO_BASE_URL:-http://127.0.0.1:25809}
      TOKEN_LOKSYSTEM_SSO_ISSUER: ${TOKEN_LOKSYSTEM_SSO_ISSUER:-loksystem://desktop}
      TOKEN_MOCK_MODE: ${TOKEN_MOCK_MODE:-false}
      TOKEN_SEED_BUILTIN_MODELS: ${TOKEN_SEED_BUILTIN_MODELS:-false}
      TOKEN_SEED_PROVIDER_CATALOGUE: ${TOKEN_SEED_PROVIDER_CATALOGUE:-true}
      TOKEN_DEFAULT_PROVIDER_BASE_URL: ${TOKEN_DEFAULT_PROVIDER_BASE_URL:-http://host.docker.internal:4000/v1}
      TOKEN_DEFAULT_PROVIDER_API_KEY: ${TOKEN_DEFAULT_PROVIDER_API_KEY:-}
      TOKEN_USD_TO_CNY_RATE: ${TOKEN_USD_TO_CNY_RATE:-7.2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      TOKEN_PROVIDER_TIMEOUT_SECONDS: ${TOKEN_PROVIDER_TIMEOUT_SECONDS:-120}
      TOKEN_CHANNEL_HEALTH_TIMEOUT_SECONDS: ${TOKEN_CHANNEL_HEALTH_TIMEOUT_SECONDS:-10}
      TOKEN_MAX_CHANNEL_ATTEMPTS: ${TOKEN_MAX_CHANNEL_ATTEMPTS:-3}
      TOKEN_CHANNEL_FAILURE_THRESHOLD: ${TOKEN_CHANNEL_FAILURE_THRESHOLD:-3}
      TOKEN_CHANNEL_CIRCUIT_COOLDOWN_SECONDS: ${TOKEN_CHANNEL_CIRCUIT_COOLDOWN_SECONDS:-60}
      TOKEN_WECHAT_MERCHANT_ID: ${TOKEN_WECHAT_MERCHANT_ID:-}
      TOKEN_WECHAT_APP_ID: ${TOKEN_WECHAT_APP_ID:-}
      TOKEN_WECHAT_CERTIFICATE_SERIAL: ${TOKEN_WECHAT_CERTIFICATE_SERIAL:-}
      TOKEN_WECHAT_PRIVATE_KEY_PATH: ${TOKEN_WECHAT_PRIVATE_KEY_PATH:-}
      TOKEN_ALIPAY_APP_ID: ${TOKEN_ALIPAY_APP_ID:-}
      TOKEN_ALIPAY_PRIVATE_KEY_PATH: ${TOKEN_ALIPAY_PRIVATE_KEY_PATH:-}
      TOKEN_ALIPAY_PUBLIC_KEY_PATH: ${TOKEN_ALIPAY_PUBLIC_KEY_PATH:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${TOKEN_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  token_postgres_data:
  token_redis_data:
