services:
  migrate:
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      TOKEN_DATABASE_URL: ${TOKEN_DATABASE_URL}
      TOKEN_ENVIRONMENT: ${TOKEN_ENVIRONMENT}
      TOKEN_AUTO_CREATE_SCHEMA: "false"
      TOKEN_PROVIDER_SECRETS_KEY: ${TOKEN_PROVIDER_SECRETS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
  token:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${TOKEN_PORT:-18000}:8000"
    environment:
      TOKEN_TASK_WORKER_INTERVAL_SECONDS: ${TOKEN_TASK_WORKER_INTERVAL_SECONDS:-2}
      TOKEN_PROVIDER_TIMEOUT_SECONDS: ${TOKEN_PROVIDER_TIMEOUT_SECONDS:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  token2:
    build: .
    restart: "no"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TOKEN_DATABASE_URL: ${TOKEN_DATABASE_URL}
      TOKEN_ENVIRONMENT: ${TOKEN_ENVIRONMENT}
      TOKEN_AUTO_CREATE_SCHEMA: "false"
      TOKEN_ADMIN_TOKEN: ${TOKEN_ADMIN_TOKEN}
      TOKEN_PROVIDER_SECRETS_KEY: ${TOKEN_PROVIDER_SECRETS_KEY}
      TOKEN_PAYMENT_WEBHOOK_SECRET: ${TOKEN_PAYMENT_WEBHOOK_SECRET}
      TOKEN_TRIAL_SIGNING_SECRET: ${TOKEN_TRIAL_SIGNING_SECRET}
      TOKEN_SECURITY_DELIVERY_WEBHOOK_URL: ${TOKEN_SECURITY_DELIVERY_WEBHOOK_URL}
      TOKEN_SECURITY_DELIVERY_WEBHOOK_SECRET: ${TOKEN_SECURITY_DELIVERY_WEBHOOK_SECRET}
      TOKEN_PUBLIC_BASE_URL: ${TOKEN_PUBLIC_BASE_URL}
      TOKEN_REDIS_URL: ${TOKEN_REDIS_URL}
      TOKEN_RATE_LIMIT_FAIL_OPEN: ${TOKEN_RATE_LIMIT_FAIL_OPEN}
      TOKEN_CACHE_ENABLED: ${TOKEN_CACHE_ENABLED}
      TOKEN_CACHE_TTL_SECONDS: ${TOKEN_CACHE_TTL_SECONDS}
      TOKEN_MAX_CONCURRENT_REQUESTS: ${TOKEN_MAX_CONCURRENT_REQUESTS}
      TOKEN_MAX_CONCURRENT_PER_KEY: ${TOKEN_MAX_CONCURRENT_PER_KEY}
      TOKEN_API_RATE_LIMIT_REQUESTS: ${TOKEN_API_RATE_LIMIT_REQUESTS}
      TOKEN_API_RATE_LIMIT_WINDOW_SECONDS: ${TOKEN_API_RATE_LIMIT_WINDOW_SECONDS}
      TOKEN_PORTAL_RATE_LIMIT_REQUESTS: ${TOKEN_PORTAL_RATE_LIMIT_REQUESTS}
      TOKEN_PORTAL_RATE_LIMIT_WINDOW_SECONDS: ${TOKEN_PORTAL_RATE_LIMIT_WINDOW_SECONDS}
      TOKEN_AUTH_RATE_LIMIT_REQUESTS: ${TOKEN_AUTH_RATE_LIMIT_REQUESTS}
      TOKEN_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${TOKEN_AUTH_RATE_LIMIT_WINDOW_SECONDS}
      TOKEN_REQUIRE_REAL_PAYMENT: ${TOKEN_REQUIRE_REAL_PAYMENT}
      TOKEN_MOCK_MODE: ${TOKEN_MOCK_MODE}
      TOKEN_SEED_BUILTIN_MODELS: ${TOKEN_SEED_BUILTIN_MODELS}
      TOKEN_SEED_PROVIDER_CATALOGUE: ${TOKEN_SEED_PROVIDER_CATALOGUE}
      TOKEN_DEFAULT_PROVIDER_BASE_URL: ${TOKEN_DEFAULT_PROVIDER_BASE_URL}
      TOKEN_DEFAULT_PROVIDER_API_KEY: ${TOKEN_DEFAULT_PROVIDER_API_KEY}
      TOKEN_PROVIDER_TIMEOUT_SECONDS: ${TOKEN_PROVIDER_TIMEOUT_SECONDS}
      TOKEN_CHANNEL_HEALTH_TIMEOUT_SECONDS: ${TOKEN_CHANNEL_HEALTH_TIMEOUT_SECONDS}
      TOKEN_MAX_CHANNEL_ATTEMPTS: ${TOKEN_MAX_CHANNEL_ATTEMPTS}
      TOKEN_CHANNEL_FAILURE_THRESHOLD: ${TOKEN_CHANNEL_FAILURE_THRESHOLD}
      TOKEN_CHANNEL_CIRCUIT_COOLDOWN_SECONDS: ${TOKEN_CHANNEL_CIRCUIT_COOLDOWN_SECONDS}
      TOKEN_TASK_WORKER_INTERVAL_SECONDS: ${TOKEN_TASK_WORKER_INTERVAL_SECONDS}
      TOKEN_TASK_MAX_ATTEMPTS: ${TOKEN_TASK_MAX_ATTEMPTS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TOKEN_PORT_2:-18001}:8000"
